# Terraform for environments/dev.
#
# Prerequisites (complete local bootstrap first; see README.md):
#   1. Local terraform apply created the storage account and deploy identity.
#   2. Signed-in user has Storage Blob Data Contributor on the state account.
#   3. State was migrated to the Azure backend.
#   4. GitHub repository secrets are configured.
#
# Trigger: push to main only — plan, then apply.

name: Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform (plan + apply)
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
      TF_VAR_github_owner: ${{ secrets.TF_VAR_github_owner }}
      # Required when provider/backend use_oidc = true (see azurerm OIDC guide)
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must be >= the version that wrote remote state (1.5.0 in CI cannot read state from 1.15.x)
          terraform_version: 1.15.5

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
