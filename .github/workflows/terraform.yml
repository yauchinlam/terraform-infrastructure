# Manual Terraform runs for environments/dev.
#
# Prerequisites (complete local bootstrap first; see README.md):
#   1. Local terraform apply created the storage account and deploy identity.
#   2. Signed-in user has Storage Blob Data Contributor on the state account.
#   3. State was migrated to the Azure backend.
#   4. GitHub repository secrets are configured.
#
# This workflow does not run on push. Use workflow_dispatch until you enable
# automatic triggers on main.

name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform (${{ inputs.action }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_location: ${{ secrets.AZURE_LOCATION }}
      TF_VAR_github_owner: ${{ secrets.TF_VAR_github_owner }}
      # Required when provider/backend use_oidc = true (see azurerm OIDC guide)
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Must be >= the version that wrote remote state (1.5.0 in CI cannot read state from 1.15.x)
          terraform_version: 1.15.5

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -out=tfplan -no-color

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
